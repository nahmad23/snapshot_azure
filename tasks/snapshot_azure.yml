---
# tasks/snapshot_azure.yml
# Called once from create_snapshots.yml when Azure VMs are present in the CSV.
# Expects:
#   azure_vms        - list of Azure VM rows from CSV
#   azure_creds      - dict {subscription_id, tenant, client_id, secret}
#   snap_name        - snapshot name
#   snap_desc        - snapshot description
#   snapshot_results - list accumulating per-source summaries
#
# Flow:
#   1. azure_rm_virtualmachine_info  → get VM location + resource ID
#   2. azure_rm_manageddisk_info     → list disks per resource group;
#                                      match OS disk via managed_by == vm.id
#                                      (both lowercased — Azure returns mixed case)
#   3. azure_rm_snapshot             → create snapshot from the OS disk

- name: Get Azure VM info (location and VM resource ID)
  azure.azcollection.azure_rm_virtualmachine_info:
    resource_group:  "{{ item.resource_group }}"
    name:            "{{ item.vm_name }}"
    subscription_id: "{{ azure_creds.subscription_id }}"
    tenant:          "{{ azure_creds.tenant }}"
    client_id:       "{{ azure_creds.client_id }}"
    secret:          "{{ azure_creds.secret }}"
  loop: "{{ azure_vms }}"
  loop_control:
    label: "{{ item.vm_name }}"
  register: az_vm_info
  ignore_errors: true

- name: Get managed disks for each unique resource group
  azure.azcollection.azure_rm_manageddisk_info:
    resource_group:  "{{ item }}"
    subscription_id: "{{ azure_creds.subscription_id }}"
    tenant:          "{{ azure_creds.tenant }}"
    client_id:       "{{ azure_creds.client_id }}"
    secret:          "{{ azure_creds.secret }}"
  loop: "{{ azure_vms | map(attribute='resource_group') | unique | list }}"
  register: az_rg_disks
  ignore_errors: true

- name: Build VM-ID-to-OS-disk-ID lookup map (lowercase keys to handle Azure mixed-case RG names)
  ansible.builtin.set_fact:
    az_os_disk_map: >-
      {{ az_os_disk_map | default({}) | combine({item.1.managed_by | lower: item.1.id}) }}
  loop: >-
    {{ az_rg_disks.results
       | subelements('ansible_info.azure_managed_disk', skip_missing=True) }}
  when:
    - not (item.0.failed | default(false))
    - item.1.managed_by is defined
    - item.1.os_type is not none

- name: Create OS disk snapshot for each Azure VM
  azure.azcollection.azure_rm_snapshot:
    resource_group:  "{{ item.item.resource_group }}"
    name:            "{{ snap_name }}-{{ item.item.vm_name }}"
    location:        "{{ item.vms[0].location }}"
    subscription_id: "{{ azure_creds.subscription_id }}"
    tenant:          "{{ azure_creds.tenant }}"
    client_id:       "{{ azure_creds.client_id }}"
    secret:          "{{ azure_creds.secret }}"
    creation_data:
      create_option: Copy
      source_id:     "{{ (az_os_disk_map | default({}))[item.vms[0].id | lower] }}"
    tags:
      snapshot_name: "{{ snap_name }}"
      source_vm:     "{{ item.item.vm_name }}"
      description:   "{{ snap_desc }}"
  loop: "{{ az_vm_info.results }}"
  loop_control:
    label: "{{ item.item.vm_name }}"
  when:
    - not item.failed
    - item.vms | default([]) | length > 0
    - (az_os_disk_map | default({}))[item.vms[0].id | lower] is defined
  ignore_errors: true
  register: az_snap_results

- name: Warn about VMs where no managed OS disk was found
  ansible.builtin.debug:
    msg: "NO OS DISK (VM found, but no managed OS disk attached in its resource group): {{ item.item.vm_name }}"
  loop: "{{ az_vm_info.results | default([]) }}"
  loop_control:
    label: "{{ item.item.vm_name }}"
  register: _az_nodisk
  when:
    - not item.failed
    - item.vms | default([]) | length > 0
    - (az_os_disk_map | default({}))[item.vms[0].id | lower] is not defined

# These VMs never reach azure_rm_snapshot, so without this they would be
# counted as neither succeeded nor failed and vanish from the totals.
- name: Collect VMs that had no managed OS disk
  ansible.builtin.set_fact:
    _az_nodisk_names: >-
      {{ _az_nodisk.results
         | default([])
         | rejectattr('skipped', 'defined')
         | map(attribute='item.item.vm_name')
         | list }}

- name: "Azure — why each VM failed (VM lookup stage)"
  ansible.builtin.debug:
    msg: "LOOKUP FAILED: {{ item.item.vm_name }} — {{ item.msg | default('no message') }}"
  loop: "{{ az_vm_info.results | default([]) }}"
  loop_control:
    label: "{{ item.item.vm_name }}"
  when: item.failed | default(false)

- name: "Azure — VMs not found in the given resource group"
  ansible.builtin.debug:
    msg: >-
      NOT FOUND: {{ item.item.vm_name }} — no VM by that name in resource group
      '{{ item.item.resource_group }}'. Check the vm_name/resource_group spelling in the CSV.
  loop: "{{ az_vm_info.results | default([]) }}"
  loop_control:
    label: "{{ item.item.vm_name }}"
  when:
    - not (item.failed | default(false))
    - item.vms | default([]) | length == 0

- name: "Azure — why each VM failed (snapshot stage)"
  ansible.builtin.debug:
    msg: "SNAPSHOT FAILED: {{ item.item.item.vm_name }} — {{ item.msg | default('no message') }}"
  loop: "{{ az_snap_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.vm_name | default('unknown') }}"
  when:
    - item.skipped is not defined
    - item.failed | default(false)

- name: Build Azure snapshot summary
  ansible.builtin.set_fact:
    _az_succeeded: >-
      {{ az_snap_results.results
         | default([])
         | rejectattr('skipped', 'defined')
         | selectattr('failed', 'equalto', false)
         | map(attribute='item.item.vm_name')
         | list }}
    _az_failed: >-
      {{ (az_snap_results.results
          | default([])
          | rejectattr('skipped', 'defined')
          | selectattr('failed', 'equalto', true)
          | map(attribute='item.item.vm_name')
          | list)
         + (az_vm_info.results
            | default([])
            | selectattr('failed', 'equalto', true)
            | map(attribute='item.vm_name')
            | list)
         + (az_vm_info.results
            | default([])
            | selectattr('failed', 'equalto', false)
            | selectattr('vms', 'defined')
            | selectattr('vms', 'equalto', [])
            | map(attribute='item.vm_name')
            | list)
         + (_az_nodisk_names | default([])) }}

- name: Append Azure results to snapshot_results
  ansible.builtin.set_fact:
    snapshot_results: >-
      {{ snapshot_results + [{
           'source':    'Azure',
           'total':     azure_vms | length,
           'succeeded': _az_succeeded,
           'failed':    _az_failed
         }] }}

- name: Azure — snapshot summary
  ansible.builtin.debug:
    msg:
      - "=== Azure VMs — snapshot: '{{ snap_name }}' ==="
      - "  Total VMs : {{ azure_vms | length }}"
      - "  Succeeded : {{ _az_succeeded | length }}"
      - "  Failed    : {{ _az_failed | length }}"
      - "  Failed VMs: {{ _az_failed if _az_failed else 'none' }}"
