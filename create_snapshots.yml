---
# Playbook: create_snapshots.yml
# Supports both VMware vCenter VMs and Azure VMs from a single CSV.
# vCenter hostnames and Azure resource groups come from the CSV —
# no infrastructure prompts. The snapshot name is auto-generated
# (yyyymmdd-security-Updates) and the inventory CSV defaults to
# vm_inventory.csv — neither is prompted. Only vCenter credentials
# (when vCenter VMs are present) and the snapshot description are asked.
#
# CSV columns required:
#   vm_name        - VM display name (must match exactly in vCenter or Azure)
#   platform       - "vcenter" or "azure"
#   datacenter     - vCenter datacenter name  /  Azure region (e.g. eastus)
#   vcenter        - vCenter hostname or IP   /  leave blank for Azure
#   resource_group - leave blank for vCenter  /  Azure resource group name

- name: Load CSV inventory and gather credentials
  hosts: localhost
  gather_facts: false

  vars_files:
    - vars/azure_vault.yml

  vars:
    # Snapshot name is auto-generated — never prompted.
    # Format: yyyymmdd-security-Updates  (e.g. 20260624-security-Updates)
    snapshot_name: "{{ now(fmt='%Y%m%d') }}-security-Updates"

    # Default inventory CSV — auto-picked, never prompted.
    # Override at runtime only if needed: -e "csv_file=/path/to/other.csv"
    csv_file: "vm_inventory.csv"

  vars_prompt:
    - name: snapshot_description
      prompt: "Snapshot description"
      private: false
      default: "Automated snapshot before change"

  tasks:
    - name: Validate CSV file exists
      ansible.builtin.stat:
        path: "{{ csv_file }}"
      register: csv_stat

    - name: Abort if CSV file not found
      ansible.builtin.fail:
        msg: "CSV file '{{ csv_file }}' not found. Please check the path."
      when: not csv_stat.stat.exists

    - name: Load VM inventory from CSV
      community.general.read_csv:
        path: "{{ csv_file }}"
      register: vm_csv

    - name: Validate CSV has required columns
      ansible.builtin.fail:
        msg: >
          CSV is missing required columns.
          Required: vm_name, platform, datacenter, vcenter, resource_group.
          Found: {{ vm_csv.list[0].keys() | list }}
      when: >
        vm_csv.list | length == 0 or
        'vm_name'        not in vm_csv.list[0] or
        'platform'       not in vm_csv.list[0] or
        'datacenter'     not in vm_csv.list[0] or
        'vcenter'        not in vm_csv.list[0] or
        'resource_group' not in vm_csv.list[0]

    # read_csv has no notion of comments, so a row commented out with a leading
    # "#" would otherwise be processed as a VM literally named "#name".
    # Drop those, plus blank rows, before anything else looks at the list.
    - name: Drop commented-out and blank rows from the CSV
      ansible.builtin.set_fact:
        vm_rows: >-
          {{ vm_csv.list
             | rejectattr('vm_name', 'match', '^\s*#')
             | rejectattr('vm_name', 'match', '^\s*$')
             | list }}

    - name: Report rows ignored as comments or blanks
      ansible.builtin.debug:
        msg: "Ignored {{ vm_csv.list | length - vm_rows | length }} commented/blank CSV row(s)"
      when: vm_csv.list | length != vm_rows | length

    - name: Split VMs by platform
      ansible.builtin.set_fact:
        vcenter_vms_all: "{{ vm_rows | selectattr('platform', 'equalto', 'vcenter') | list }}"
        azure_vms:       "{{ vm_rows | selectattr('platform', 'equalto', 'azure')   | list }}"

    - name: Extract unique vCenter hostnames
      ansible.builtin.set_fact:
        vcenter_hosts: "{{ vcenter_vms_all | map(attribute='vcenter') | unique | list | sort }}"

    # -------------------------------------------------------------------------
    # Install Azure Python SDK dependencies when Azure VMs are present
    # -------------------------------------------------------------------------
    # azcollection 1.x ships "requirements-azure.txt"; 2.x renamed it to
    # "requirements.txt". Search both names, and search every collection root
    # rather than a hardcoded list — the path differs between galaxy installs,
    # distro packages and pip installs.
    - name: Find Azure collection requirements file
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          find
          "$HOME/.ansible/collections"
          /usr/share/ansible/collections
          /usr/local/share/ansible/collections
          /usr/lib/python3/dist-packages/ansible_collections
          /usr/local/lib/python3*/dist-packages/ansible_collections
          -maxdepth 6 -type f
          \( -name requirements-azure.txt -o -name requirements.txt \)
          -path '*azure/azcollection/*'
          -print 2>/dev/null | head -n 1
      register: az_req_file
      changed_when: false
      when: azure_vms | length > 0

    - name: Install Azure Python SDK from collection requirements file
      ansible.builtin.command:
        cmd: >-
          /usr/bin/python3 -m pip install --quiet --break-system-packages
          -r {{ az_req_file.stdout }}
      when:
        - azure_vms | length > 0
        - az_req_file.stdout | default('') | length > 0
      changed_when: true

    # Only reached when the collection's own requirements file cannot be found.
    # Must cover everything azure_rm_common.py imports at module load — a single
    # missing package makes every azure_rm_* module fail with
    # "Failed to import the required Python library".
    - name: Install core Azure Python SDK packages (fallback if requirements file not found)
      ansible.builtin.command:
        cmd: >-
          /usr/bin/python3 -m pip install --quiet --break-system-packages
          packaging requests xmltodict msrest msrestazure
          azure-common azure-core azure-identity azure-nspkg
          azure-storage-blob
          azure-mgmt-core
          "azure-mgmt-compute>=21.0.0"
          "azure-mgmt-resource>=21.0.0"
          "azure-mgmt-network>=19.0.0"
          "azure-mgmt-storage>=19.0.0"
          azure-mgmt-authorization
          azure-mgmt-dns
          azure-mgmt-privatedns
          azure-mgmt-keyvault
          azure-mgmt-monitor
          azure-mgmt-trafficmanager
          azure-mgmt-containerservice
          azure-mgmt-containerregistry
          azure-mgmt-containerinstance
          azure-mgmt-managedservices
          azure-mgmt-managementgroups
          azure-mgmt-marketplaceordering
          azure-mgmt-redis
          azure-mgmt-search
          azure-mgmt-servicebus
          azure-mgmt-sql
          azure-mgmt-web
          azure-mgmt-cdn
          azure-mgmt-batch
          azure-mgmt-cosmosdb
          azure-mgmt-devtestlabs
          azure-mgmt-eventhub
          azure-mgmt-hdinsight
          azure-mgmt-iothub
          azure-mgmt-loganalytics
          azure-mgmt-notificationhubs
          azure-mgmt-rdbms
          azure-mgmt-recoveryservices
          azure-mgmt-recoveryservicesbackup
          azure-mgmt-automation
          azure-mgmt-apimanagement
          azure-mgmt-datafactory
      when:
        - azure_vms | length > 0
        - az_req_file.stdout | default('') | length == 0
      changed_when: true

    - name: Verify the Azure SDK imports cleanly before touching Azure
      ansible.builtin.command:
        cmd: >-
          /usr/bin/python3 -c
          "import azure.mgmt.compute, azure.mgmt.dns, azure.mgmt.resource, azure.identity"
      register: az_sdk_check
      changed_when: false
      failed_when: false
      when: azure_vms | length > 0

    - name: Abort early with a clear message if the Azure SDK is incomplete
      ansible.builtin.fail:
        msg: >-
          Azure Python SDK is incomplete — every azure_rm_* module would fail with
          "Failed to import the required Python library". Install the collection
          requirements manually:
          pip install --break-system-packages -r <azcollection>/requirements.txt
          Import error was: {{ az_sdk_check.stderr | default('') | trim }}
      when:
        - azure_vms | length > 0
        - az_sdk_check.rc | default(0) != 0

    - name: Show platforms and counts detected in CSV
      ansible.builtin.debug:
        msg:
          - "CSV loaded: {{ vm_rows | length }} usable VMs ({{ vm_csv.list | length }} rows read)"
          - "  VMware vCenter VMs : {{ vcenter_vms_all | length }} across {{ vcenter_hosts | length }} vCenter(s)"
          - "  Azure VMs          : {{ azure_vms | length }}"

    # -------------------------------------------------------------------------
    # vCenter credentials — prompted only when vCenter VMs are present
    # -------------------------------------------------------------------------
    - name: "Prompt — vCenter username (shared for all vCenters)"
      ansible.builtin.pause:
        prompt: "vCenter username (e.g. administrator@vsphere.local)"
      register: vc_user_input
      when: vcenter_vms_all | length > 0

    - name: "Prompt — vCenter password"
      ansible.builtin.pause:
        prompt: "vCenter password (used for all vCenters)"
        echo: false
      register: vc_pass_input
      no_log: true
      when: vcenter_vms_all | length > 0

    # -------------------------------------------------------------------------
    # Build credential maps
    # -------------------------------------------------------------------------
    - name: Build vCenter credentials map (shared for all vCenters)
      ansible.builtin.set_fact:
        vcenter_creds: >-
          {{ vcenter_creds | default({}) | combine({
               item: {
                 'host':     item,
                 'user':     vc_user_input.user_input,
                 'password': vc_pass_input.user_input
               }
             }) }}
      loop: "{{ vcenter_hosts }}"
      loop_control:
        label: "{{ item }}"
      no_log: true
      when: vcenter_vms_all | length > 0

    - name: Build Azure credentials from vault
      ansible.builtin.set_fact:
        azure_creds:
          subscription_id: "{{ vault_azure_subscription_id }}"
          tenant:          "{{ vault_azure_tenant_id }}"
          client_id:       "{{ vault_azure_client_id }}"
          secret:          "{{ vault_azure_secret }}"
      no_log: true
      when: azure_vms | length > 0

    - name: Build VMs-by-vCenter map
      ansible.builtin.set_fact:
        vms_by_vcenter: >-
          {{ vms_by_vcenter | default({}) | combine({
               item: vcenter_vms_all | selectattr('vcenter', 'equalto', item) | list
             }) }}
      loop: "{{ vcenter_hosts }}"
      when: vcenter_vms_all | length > 0

    - name: Store snapshot metadata and initialise results list
      ansible.builtin.set_fact:
        snap_name: "{{ snapshot_name }}"
        snap_desc: "{{ snapshot_description }}"
        snapshot_results: []
        cacheable: false

    - name: Inventory summary
      ansible.builtin.debug:
        msg: >-
          Platforms detected:
          {% if vcenter_hosts | length > 0 %}
          VMware vCenter ({{ vcenter_hosts | length }} vCenter(s)):
          {% for vc in vcenter_hosts %}
            {{ vc }}: {{ vms_by_vcenter[vc] | length }} VMs
          {% endfor %}
          {% endif %}
          {% if azure_vms | length > 0 %}
          Azure: {{ azure_vms | length }} VMs across
          {{ azure_vms | map(attribute='resource_group') | unique | list | length }} resource group(s)
          {% endif %}

# ---------------------------------------------------------------------------
# VMware vCenter snapshots
# ---------------------------------------------------------------------------
- name: Create snapshots on all vCenters
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Process snapshots for each vCenter
      ansible.builtin.include_tasks: tasks/snapshot_vcenter.yml
      loop: "{{ vcenter_hosts | default([]) }}"
      loop_control:
        loop_var: current_vc_host
        label: "{{ current_vc_host }}"
      when: vcenter_hosts | default([]) | length > 0

# ---------------------------------------------------------------------------
# Azure VM snapshots
# ---------------------------------------------------------------------------
- name: Create snapshots for Azure VMs
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Process Azure VM snapshots
      ansible.builtin.include_tasks: tasks/snapshot_azure.yml
      when: azure_vms | default([]) | length > 0

# ---------------------------------------------------------------------------
# Combined final report
# ---------------------------------------------------------------------------
- name: Final combined report
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Per-source snapshot results
      ansible.builtin.debug:
        msg:
          - "=== {{ item.source }} ==="
          - "  Total VMs : {{ item.total }}"
          - "  Succeeded : {{ item.succeeded | length }}"
          - "  Failed    : {{ item.failed | length }}"
          - "  Failed VMs: {{ item.failed if item.failed else 'none' }}"
      loop: "{{ snapshot_results }}"
      loop_control:
        label: "{{ item.source }}"

    - name: Overall snapshot report
      ansible.builtin.debug:
        msg:
          - "========================================="
          - " SNAPSHOT RUN COMPLETE"
          - "========================================="
          - " Snapshot name : {{ snap_name }}"
          - " CSV inventory : {{ vm_rows | length }} VMs total"
          - " VMware vCenters: {{ vcenter_hosts | default([]) | length }}"
          - " Azure VMs      : {{ azure_vms | default([]) | length }}"
          - "-----------------------------------------"
          - " Total succeeded : {{ snapshot_results | map(attribute='succeeded') | map('length') | sum }}"
          - " Total failed    : {{ snapshot_results | map(attribute='failed')    | map('length') | sum }}"
          - "========================================="

    - name: List all failed VMs across all sources
      ansible.builtin.debug:
        msg: "FAILED on {{ item.0.source }}: {{ item.1 }}"
      loop: >-
        {{ snapshot_results
           | selectattr('failed', 'ne', [])
           | subelements('failed') }}
      loop_control:
        label: "{{ item.1 }}"
      when: snapshot_results | map(attribute='failed') | map('length') | sum > 0

    - name: Fail playbook if any snapshot failed
      ansible.builtin.fail:
        msg: >-
          {{ snapshot_results | map(attribute='failed') | map('length') | sum }}
          VM(s) failed to snapshot. See list above.
      when: snapshot_results | map(attribute='failed') | map('length') | sum > 0
